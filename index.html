<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сигма — профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Кастомный курсор -->
<div class="cursor"></div>

<!-- Эффект клика -->
<div class="click-effect"></div>

<!-- Контейнер для сердечек -->
<div class="hearts"></div>

<div class="card">
    <img src="assets/avatar.jpg" class="avatar">

    <h1 class="name">Sounsy</h1>
    <p class="handle">@wwvuo</p>

    <div class="tags">
        <span>DEV</span>
        <span>GAMER</span>
        <span>MINECRAFT</span>
    </div>

    <div class="info">
        <p><b>Hobby:</b> Coding</p>
        <p><b>Real name:</b> Kirill</p>
        <p><b>Country:</b> Russia</p>
        <p><b>Favorite game:</b> Minecraft</p>
        <p><b>I know languages:</b> Russian, English</p>
        <p><b>My programming languages:</b> Lua, Python, Java (so little)</p>
        <p><b>My love is: </b> M❤️ </p>
    </div>

    <div class="links">
        <a href="https://t.me/wwvuo" class="btn tg">Telegram</a>
        <a href="https://steamcommunity.com/profiles/76561199809013709/" class="btn gh">Steam</a>
        <a href="https://discord.gg/EjVttyQr" class="btn ds">Discord</a>
    </div>
</div>

<script>
// Генерация сердечек
for (let i = 0; i < 300; i++) {
    const h = document.createElement("span");
    h.textContent = "❤️";
    h.classList.add("heart");

    h.style.top = Math.random() * 100 + "%";
    h.style.animationDelay = Math.random() * 5 + "s";
    h.style.animationDuration = (5 + Math.random() * 10) + "s";

    document.querySelector(".hearts").appendChild(h);
}

// Кастомный курсор
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});

// Эффект клика — стабильная версия
const clickFx = document.querySelector(".click-effect");

document.addEventListener("click", e => {
    clickFx.style.left = e.clientX + "px";
    clickFx.style.top = e.clientY + "px";

    clickFx.classList.remove("active");
    void clickFx.offsetWidth; // перезапуск анимации
    clickFx.classList.add("active");
});
</script>

</body>
</html>
